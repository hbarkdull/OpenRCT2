trigger:
- develop

jobs:
  - job: Deploy_Orka_VM
    pool: ubuntu

    variables:
    - name: image
      value: sonoma-90gb-orka3-arm 

    - name: cpu
      value: 4

    - name: memory
      value: 8

    steps:
    - script: |
        ORKA_OUTPUT=$(orka3 vm deploy --image ${{ variables.image }} --cpu ${{ variables.cpu }} --memory ${{ variables.memory }} --generate-name azure-devops --output json)
        VM_NAME=$(echo $ORKA_OUTPUT | jq -r '.[0].name')
        echo "##vso[task.setvariable variable=VM_NAME;isOutput=true]$VM_NAME"
      name: set_vars
      displayName: "Deploy Orka VM"

  - job: ios_build
    pool: orka  # Ensure this matches your Orka agent pool name
    dependsOn: Deploy_Orka_VM
    steps:
    - script: |
        VM_NAME=$(dependencies.Deploy_Orka_VM.outputs['set_vars.VM_NAME'])
        echo "Running build on VM: $VM_NAME"
        echo "Build process would go here..."
      displayName: "iOS Build"

  - job: delete_VM
    pool: ubuntu
    dependsOn: ios_build
      
    steps:
      - script: |
          echo "Deleting VM: $(dependencies.Deploy_Orka_VM.outputs['set_vars.VM_NAME'])"
          orka3 vm delete $(dependencies.Deploy_Orka_VM.outputs['set_vars.VM_NAME'])
        displayName: "Delete Orka VM"